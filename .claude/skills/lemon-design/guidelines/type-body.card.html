<!-- @dsCard group="Type" viewport="700x190" name="Body & UI — DM Sans" subtitle="Body, small, caption · 400–600" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--bg-content);font-family:var(--font-body);padding:24px;color:var(--text-primary)}
  .row{margin-bottom:12px}
  .spec{font-family:var(--font-mono);font-size:10.5px;color:var(--text-tertiary);margin-left:10px}
  .body{font-size:15px;line-height:1.6}
  .bodym{font-size:15px;font-weight:600}
  .small{font-size:13px;color:var(--text-secondary)}
  .cap{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head>
<body>
  <div class="row"><span class="body">Controle suas finanças sem esforço.</span><span class="spec">body · 15 / 400</span></div>
  <div class="row"><span class="bodym">Gasto com Uber</span><span class="spec">medium · 15 / 600</span></div>
  <div class="row"><span class="small">10 de jun. · Lucas · via WhatsApp</span><span class="spec">small · 13 / 400</span></div>
  <div class="row"><span class="cap">Transações recentes</span><span class="spec">caption · 11 / 600 · upper</span></div>
</body></html>
