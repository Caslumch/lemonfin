<!-- @dsCard group="Colors" viewport="700x150" name="Lemon — primary" subtitle="#D4F400 · CTAs, active states, highlights" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--bg-content);font-family:var(--font-body);padding:20px}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--radius-md);height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
  .name{font-size:11px;font-weight:600}
  .hex{font-family:var(--font-mono);font-size:10px;opacity:.75}
  .dark{color:#fff}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--lemon-100)"><span class="name">100</span><span class="hex">#F3FCB8</span></div>
    <div class="sw" style="background:var(--lemon-200)"><span class="name">200</span><span class="hex">#E9FA85</span></div>
    <div class="sw" style="background:var(--lemon-300)"><span class="name">300</span><span class="hex">#DEF74D</span></div>
    <div class="sw" style="background:var(--lemon-400);box-shadow:var(--shadow-lemon)"><span class="name">400 ·base</span><span class="hex">#D4F400</span></div>
    <div class="sw dark" style="background:var(--lemon-600)"><span class="name">600</span><span class="hex">#A8C200</span></div>
    <div class="sw dark" style="background:var(--lemon-700)"><span class="name">700</span><span class="hex">#8A9F00</span></div>
  </div>
</body></html>
