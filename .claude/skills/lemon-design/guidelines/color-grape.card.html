<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--bg-content);font-family:var(--font-body);padding:20px}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--radius-md);height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
  .name{font-size:11px;font-weight:600}
  .hex{font-family:var(--font-mono);font-size:10px;opacity:.75}
  .dark{color:#fff}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--grape-50)"><span class="name">50</span><span class="hex">#F0EEFD</span></div>
    <div class="sw" style="background:var(--grape-100)"><span class="name">100</span><span class="hex">#E3DEFB</span></div>
    <div class="sw" style="background:var(--grape-300)"><span class="name">300</span><span class="hex">#AA9DF2</span></div>
    <div class="sw dark" style="background:var(--grape-500);box-shadow:var(--shadow-grape)"><span class="name">500 ·base</span><span class="hex">#6C5CE7</span></div>
    <div class="sw dark" style="background:var(--grape-600)"><span class="name">600</span><span class="hex">#5544D6</span></div>
    <div class="sw dark" style="background:var(--grape-700)"><span class="name">700</span><span class="hex">#4534AE</span></div>
  </div>
</body></html>
