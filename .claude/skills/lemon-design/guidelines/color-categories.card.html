<!-- @dsCard group="Colors" viewport="700x180" name="Categories" subtitle="Fixed palette per spend category" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--bg-content);font-family:var(--font-body);padding:20px}
  .grid{display:flex;flex-wrap:wrap;gap:10px}
  .pill{padding:7px 14px;border-radius:var(--radius-full);font-size:13px;font-weight:600}
</style></head>
<body>
  <div class="grid">
    <span class="pill" style="background:var(--cat-food-bg);color:var(--cat-food-fg)">Alimentação</span>
    <span class="pill" style="background:var(--cat-transport-bg);color:var(--cat-transport-fg)">Transporte</span>
    <span class="pill" style="background:var(--cat-housing-bg);color:var(--cat-housing-fg)">Moradia</span>
    <span class="pill" style="background:var(--cat-leisure-bg);color:var(--cat-leisure-fg)">Lazer</span>
    <span class="pill" style="background:var(--cat-health-bg);color:var(--cat-health-fg)">Saúde</span>
    <span class="pill" style="background:var(--cat-education-bg);color:var(--cat-education-fg)">Educação</span>
    <span class="pill" style="background:var(--cat-shopping-bg);color:var(--cat-shopping-fg)">Compras</span>
    <span class="pill" style="background:var(--cat-salary-bg);color:var(--cat-salary-fg)">Salário</span>
    <span class="pill" style="background:var(--cat-freelance-bg);color:var(--cat-freelance-fg)">Freelance</span>
    <span class="pill" style="background:var(--cat-other-bg);color:var(--cat-other-fg)">Outros</span>
  </div>
</body></html>
