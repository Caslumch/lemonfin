<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — finance" subtitle="Success · danger · warning, with muted tints" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--bg-content);font-family:var(--font-body);padding:20px}
  .row{display:flex;gap:14px}
  .item{flex:1}
  .bar{height:46px;border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:700;font-size:14px}
  .tint{height:34px;border-radius:var(--radius-sm);margin-top:8px;display:flex;align-items:center;padding:0 14px;font-weight:600;font-size:12.5px}
  .cap{font-size:11px;color:var(--text-tertiary);font-family:var(--font-mono);margin-top:7px}
</style></head>
<body>
  <div class="row">
    <div class="item">
      <div class="bar" style="background:var(--success)">+ R$ 1.200,00</div>
      <div class="tint" style="background:var(--success-muted);color:var(--success-strong)">Entradas · positivo</div>
      <div class="cap">success #22C55E</div>
    </div>
    <div class="item">
      <div class="bar" style="background:var(--danger)">− R$ 70,00</div>
      <div class="tint" style="background:var(--danger-muted);color:var(--danger)">Saídas · negativo</div>
      <div class="cap">danger #EF4444</div>
    </div>
    <div class="item">
      <div class="bar" style="background:var(--warning)">Limite próximo</div>
      <div class="tint" style="background:var(--warning-muted);color:#B45309">Aviso · atenção</div>
      <div class="cap">warning #F59E0B</div>
    </div>
  </div>
</body></html>
