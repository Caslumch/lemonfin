<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid · space-1 … space-10" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--bg-content);font-family:var(--font-body);padding:22px}
  .row{display:flex;gap:18px;align-items:flex-end}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--grape-500);border-radius:4px;width:22px}
  .t{font-family:var(--font-mono);font-size:10.5px;color:var(--text-secondary)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:var(--space-1)"></div><span class="t">1·4</span></div>
    <div class="item"><div class="bar" style="height:var(--space-2)"></div><span class="t">2·8</span></div>
    <div class="item"><div class="bar" style="height:var(--space-3)"></div><span class="t">3·12</span></div>
    <div class="item"><div class="bar" style="height:var(--space-4)"></div><span class="t">4·16</span></div>
    <div class="item"><div class="bar" style="height:var(--space-5)"></div><span class="t">5·20</span></div>
    <div class="item"><div class="bar" style="height:var(--space-6)"></div><span class="t">6·24</span></div>
    <div class="item"><div class="bar" style="height:var(--space-7)"></div><span class="t">7·32</span></div>
    <div class="item"><div class="bar" style="height:var(--space-8)"></div><span class="t">8·40</span></div>
    <div class="item"><div class="bar" style="height:var(--space-9)"></div><span class="t">9·48</span></div>
    <div class="item"><div class="bar" style="height:var(--space-10)"></div><span class="t">10·64</span></div>
  </div>
</body></html>
