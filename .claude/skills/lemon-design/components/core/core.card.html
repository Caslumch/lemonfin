<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-content); font-family: var(--font-body); }
  .wrap { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); width: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Badge, Avatar } = window.LemonFinDesignSystem_1143b6;
const Plus = <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>;
const Arrow = <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>;
const Bell = <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 7 2 8 2 8H4s2-1 2-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>;

function App() {
  return (
    <div className="wrap">
      <div className="row"><span className="lbl">Variants</span>
        <Button variant="primary" pill iconLeft={Plus}>Nova transação</Button>
        <Button variant="secondary" pill iconLeft={Arrow}>Enviar</Button>
        <Button variant="grape">Receber</Button>
        <Button variant="outline">Filtrar</Button>
        <Button variant="ghost">Ver todas</Button>
        <Button variant="danger">Excluir</Button>
      </div>
      <div className="row"><span className="lbl">Sizes & disabled</span>
        <Button size="sm">Small</Button>
        <Button size="md">Medium</Button>
        <Button size="lg">Large</Button>
        <Button disabled>Disabled</Button>
      </div>
      <div className="row"><span className="lbl">Icon buttons</span>
        <IconButton variant="grape" icon={Plus} ariaLabel="add" />
        <IconButton variant="lemon" icon={Plus} ariaLabel="add" />
        <IconButton variant="dark" icon={Arrow} ariaLabel="send" />
        <IconButton variant="light" icon={Bell} ariaLabel="bell" />
        <IconButton variant="ghost" icon={Bell} ariaLabel="bell" />
      </div>
      <div className="row"><span className="lbl">Badges</span>
        <Badge category="transporte">Transporte</Badge>
        <Badge category="alimentacao">Alimentação</Badge>
        <Badge category="moradia">Moradia</Badge>
        <Badge status="income">+ Entrada</Badge>
        <Badge status="expense">− Saída</Badge>
        <Badge status="warning">Limite</Badge>
        <Badge status="lemon">Novo</Badge>
      </div>
      <div className="row"><span className="lbl">Avatars</span>
        <Avatar name="Lucas Machado" size="lg" />
        <Avatar name="Emily Souza" />
        <Avatar name="Ryan Alves" size="sm" />
        <div style={{ display: 'flex' }}>
          <Avatar name="Daniel" ring style={{ marginRight: -10 }} />
          <Avatar name="Emily" ring style={{ marginRight: -10 }} />
          <Avatar name="Ryan" ring />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
